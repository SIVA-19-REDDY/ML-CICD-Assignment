<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML CI/CD Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f8;
            margin: 0;
            padding: 50px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #222;
        }

        .details {
            text-align: left;
            margin-top: 30px;
        }

        .item {
            padding: 15px;
            margin: 10px 0;
            background-color: #f1f3f5;
            border-radius: 8px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Machine Learning CI/CD Pipeline</h1>

        <div class="details">

            <div class="item">
                <strong>ML Model:</strong>
                Random Forest Classifier
            </div>

            <div class="item">
                <strong>Dataset:</strong>
                Iris Dataset
            </div>

            <div class="item">
                <strong>Model Accuracy:</strong>
                93.33%
            </div>

            <div class="item">
                <strong>CI/CD Status:</strong>
                <span class="status">Successfully Deployed</span>
            </div>

        </div>

        <p>
            This website is deployed automatically using
            GitHub Actions and GitHub Pages.
        </p>

    </div>

</body>
</html>
